version: '3'

tasks:
  build:
    desc: Build project without output
    cmds:
      - go build ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  coverage:
    desc: Run unit tests with code coverage
    cmds:
      - go test -cover -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
      - ./scripts/coverage_check.sh coverage.out 0
  
  lint:
    desc: Lint Go code
    cmds:
      - go vet ./...
      - golangci-lint run